[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rascal-lab"
version = "0.1.0"
description = "Shared checks and CLIs for the Rascal parameter-golf experiment lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["sentencepiece>=0.2.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["rascal_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
