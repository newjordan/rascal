name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lab tooling
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Syntax-check active trainers and tools
        run: python -m compileall -q rascal_lab scripts rascal_loop midnight mom95_mlp45 mom95_mlp45_kernel whale_donor control_NOCHANGE
